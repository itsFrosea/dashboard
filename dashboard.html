<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://unpkg.com/lucide@latest"></script>
<title>Sharan Bot Dashboard</title>

<link rel="stylesheet" href="dashboard.css">

</head>


<body>

<div class="app">

<!-- ========================= -->
<!-- SIDEBAR -->
<!-- ========================= -->

<div id="sidebar" class="collapsed">

    <div class="sidebarTop">
        <button id="toggleSidebar">
            <i data-lucide="menu"></i>
        </button>

        <h2 class="sidebarTitle">Sharan Bot</h2>
    </div>

    <button onclick="openPage('leaderboard')">
        <i data-lucide="trophy"></i>
        <span>Leaderboard</span>
    </button>

    <button onclick="openPage('economy')">
        <i data-lucide="coins"></i>
        <span>Economy</span>
    </button>

    <button onclick="openPage('commands')">
        <i data-lucide="zap"></i>
        <span>Commands</span>
    </button>

    <button onclick="openPage('timed')">
        <i data-lucide="clock-3"></i>
        <span>Timed Messages</span>
    </button>

</div>


<!-- ========================= -->
<!-- MAIN CONTENT -->
<!-- ========================= -->

<div id="content">


<!-- ========================= -->
<!-- LEADERBOARD -->
<!-- ========================= -->

<div id="leaderboard" class="page">

<h2>Top Chatters</h2>

<table id="leaderboardTable">

<thead>

<tr>
<th>User</th>
<th>Points</th>
</tr>

</thead>

<tbody>

</tbody>

</table>

</div>



<!-- ========================= -->
<!-- ECONOMY SETTINGS -->
<!-- ========================= -->

<div id="economy" class="page">

<h2>Economy Settings</h2>

<label>Currency Name</label>
<input id="currencyName">

<label>Points Per Message</label>
<input id="pointsPerMessage" type="number">

<label>Daily Reward</label>
<input id="dailyReward" type="number">

<br><br>

<button onclick="saveEconomy()">
Save Economy Settings
</button>

<h3>Medals System</h3>

<div class="toggleRow">

<span>Enable Medals</span>

<label class="switch">
<input type="checkbox" id="medalsEnabled">
<span class="slider"></span>
</label>

</div>

<br><br>

<button onclick="saveMedals()">
Save Medal Settings
</button>

</div>



<!-- ========================= -->
<!-- CUSTOM COMMANDS -->
<!-- ========================= -->

<div id="commands" class="page">

<h2>Custom Commands</h2>

<div class="cmdLayout">

  <!-- LEFT SIDE -->
  <div class="cmdLeft">

    <label>Command</label>
    <input id="commandName" placeholder="!lurk">

    <label>Response</label>
    <input id="commandResponse" placeholder="{user} is now lurking!">

  </div>

  <!-- RIGHT SIDE -->
  <div class="cmdRight">

    <div class="cmdHelp">
      <b>Preview:</b>
      <div id="cmdPreview">{user} is now lurking!</div>

      <br>

      <b>Available variables:</b><br>
      <span><code>{user}</code> → you</span><br>
      <span><code>{target}</code> → mentioned user</span>
    </div>

  </div>

</div>

<label>
    <input type="checkbox" id="givePoints">
    Give Points
</label>

<input type="number" id="pointsAmount" placeholder="Points amount">

<div id="commandsList"></div>

<br><br>

<button id="commandSubmitBtn" onclick="addCommand()">
Add Command
</button>

</div>



<!-- ========================= -->
<!-- TIMED MESSAGES -->
<!-- ========================= -->

<div id="timed" class="page">

<h2>Timed Messages</h2>

<label>Message</label>
<input id="timedMessage" placeholder="Follow the stream!">

<label>Message Interval</label>
<input id="timedInterval" type="number">

<br><br>

<button id="timedSubmitBtn" onclick="addTimed()">
Add Timed Message
</button>

<hr>

<div id="timedList"></div>

</div>



</div>

</div>

<div id="contextMenu">

<button id="deleteCommandBtn">
🗑 Delete Command
</button>

</div>

<script src="dashboard.js"></script>

</body>

</html>
